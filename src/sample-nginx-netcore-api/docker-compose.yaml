services:
  # Nginx Reverse Proxy Server
  reverse-proxy:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./wwwroot:/usr/share/nginx/html:ro # Mounts static files directly into Nginx
    depends_on:
      - dotnet-api

  # .NET Core API Application
  dotnet-api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: dotnet_api
    build:
      context: ./src/WebApplication1
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080 # Tells .NET to run on internal port 8080
    # No 'ports' mapped here; Nginx accesses it over the shared internal network

    # Build containers and run
    # docker compose down && docker compose build --no-cache --pull && docker compose up -d

    # Usage
    # http://localhost
    # http://localhost/api/weatherforecast