events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Upstream definition matching the .NET container service name in compose.yaml
    upstream backend_api {
        server dotnet-api:8080; 
    }

    server {
        listen 80;
        server_name localhost;

        # 1. Route for the Static Website
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html; # Essential for SPA routing (React/Vue/Angular)
        }

        # 2. Route for the .NET Core API
        location /api/ {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            
            # Forward headers so .NET Core can discover the real client IP and scheme
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
