name: gpu_model_server_vllm

services:
  # ==========================================
  # GPU MODEL SERVER  - vLLM
  # ==========================================
  vllm-backend:
    build:
      context: .
      dockerfile: dockerfile.vllm

    container_name: vllm_gpu
    
    restart: unless-stopped

    # Shared memory
    shm_size: "2gb"

    # Memory and stack limits
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864

    environment:
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE}

    volumes:
      # Maps the "./my_models" folder on your host machine to "/models" inside the container
      - ./my_models:/models:ro

    # Internal API port; not exposed to the host
    expose:
      - "8000"

    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "curl -f -s http://127.0.0.1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
      
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model ${MODEL_PATH}
      --port 8000
      --max-model-len ${MAX_MODEL_LEN}
    networks:
      - ai-network

  # ==========================================
  # PYTHON CHAT UI FRONTEND
  # ==========================================
  chat-ui:
    build:
      context: .
      dockerfile: dockerfile.chat-ui
    container_name: python_chat_ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_BASE=http://vllm-backend:8000/v1
      - MODEL_NAME=${MODEL_PATH}
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL}
      - MAX_CONCURRENT_CHATS=${MAX_CONCURRENT_CHATS}
    depends_on:
      vllm-backend:
        condition: service_healthy
    healthcheck:
      # FIXED: Added the missing .1 and targeted port 8080 correctly
      test: ["CMD", "/bin/sh", "-c", "curl -f -s -I http://127.0.0.1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge





# 1. Clean out your previous layout cache blocks and build images
# docker compose build --no-cache

# 2. Spin up the cluster infrastructure in background isolation
# docker compose up -d --force-recreate

# 3. Monitor live weights download and model state progression
# docker logs -f vllm_gpu

# 4. (Optional Optimization) Verify NVIDIA hardware scheduling and utilization metrics inside vLLM
# docker exec -it vllm_gpu nvidia-smi

# 5. Pull the model into your GPU server volume
# docker exec -it vllm_gpu ollama pull qwen2.5-coder:1.5b