name: gpu_model_server_vllm

services:
  # ==========================================
  # GPU MODEL SERVER  - vLLM
  # ==========================================
  vllm-backend:
    build:
      context: .
      dockerfile: dockerfile.vllm

    container_name: vllm_gpu  # remove for production beter scalling
    
    restart: unless-stopped
    init: true

    # Shared memory
    #shm_size: "16gb"

    # Use host ram instead of 'shm_size: "16gb"'
    ipc: host

    # Memory and stack limits
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864

    environment:
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE}  # Do not attempt to connect to the internet.
      - HF_HUB_DISABLE_TELEMETRY=1  # Disable its telemetry reporting

    volumes:
      # Maps the "./my_models" folder on your host machine to "/models" inside the container. ro:readonly
      - ./my_models:/models:ro

    # Internal API port; not exposed to the host
    expose:
      - "8000"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    command: >
      --model ${MODEL_PATH}
      --port 8000
      --max-model-len ${MAX_MODEL_LEN}
      
    networks:
      - ai-network

  # ==========================================
  # PYTHON CHAT UI FRONTEND
  # ==========================================
  chat-ui:
    build:
      context: .
      dockerfile: dockerfile.chat-ui
    container_name: python_chat_ui_vllm
    restart: unless-stopped
    init: true
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_BASE=http://vllm-backend:8000/v1
      - MODEL_NAME=${MODEL_PATH}
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL}
      - MAX_CONCURRENT_CHATS=${MAX_CONCURRENT_CHATS}
    depends_on:
      vllm-backend:
        condition: service_healthy
    healthcheck:
      # FIXED: Added the missing .1 and targeted port 8080 correctly
      test: ["CMD", "/bin/sh", "-c", "curl -f -s -I http://127.0.0.1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge





