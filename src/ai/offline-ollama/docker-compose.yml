services:
  # The GPU Model Server (Ollama)
  ollama-backend:
    build:
      context: .
      dockerfile: dockerfile.ollama  # FIX: Kept consistent with standard capitalized naming
    container_name: ollama_gpu
    # --- PERFORMANCE & MEMORY FIXES ---
    ipc: host  # Maps --ipc=host
    ulimits:   # Maps your --ulimit configurations
      memlock: -1
      stack: 67108864
    # ----------------------------------
    volumes:
      - ./ollama_storage:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # The Python Chat UI Frontend
  chat-ui:
    build:
      context: .
      dockerfile: dockerfile.chat-ui  # FIX: Kept consistent with standard capitalized naming
    container_name: python_chat_ui
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_HOST=http://ollama-backend:11434
    depends_on:
      - ollama-backend


# 1. Build the images without using old cache layers
# docker compose build --no-cache

# 2. Spin up the cluster in the background
# docker compose up -d --force-recreate

# 3. Automatically pull the llama3.1 model into your GPU server volume
# docker exec -it ollama_gpu ollama pull llama3.1
# docker exec -it ollama_gpu ollama pull qwen2.5-coder:1.5b